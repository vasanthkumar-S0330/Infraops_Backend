services:
  # Spring Boot Backend
  infraops-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: infraops-backend
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      # By default, it will use the MongoDB Atlas URI in your application.properties.
      # If you want to use a local MongoDB container, uncomment the lines below and the mongodb service block.
      # - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/infraops_db
    restart: unless-stopped
